
<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Setup -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>
      George Gregory D. Misa | Web & Mobile Developer
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Explore the portfolio of George Gregory D. Misa, an aspiring software engineer and web and mobile application developer. Discover my projects, technical skills, and development experience."
    />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Website Theme -->
    <meta name="theme-color" content="#050816" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Open Graph: Facebook, Messenger, LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="George Gregory D. Misa | Developer Portfolio"
    />

    <meta
      property="og:description"
      content="Explore my web and mobile development projects, technical skills, and journey as an aspiring software engineer."
    />

    <meta
      property="og:site_name"
      content="George Misa Portfolio"
    />

    <!-- Twitter / X Preview -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="George Gregory D. Misa | Developer Portfolio"
    />

    <meta
      name="twitter:description"
      content="Web and Mobile Developer | React, Node.js, Kotlin, SwiftUI | Explore my projects and skills."
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
